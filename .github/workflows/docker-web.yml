name: docker-web

# Builds the self-hosted images and publishes web to GHCR,
# so it can be pulled without a local build:
#   docker pull ghcr.io/dung-x/client-locket-dio-web:latest
on:
  push:
    branches: [main]
    paths:
      - "apps/self-hosted/**"
      - ".github/workflows/docker-web.yml"
  pull_request:
    paths:
      - "apps/self-hosted/**"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dung-x/client-locket-dio-web

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/self-hosted/web
          file: apps/self-hosted/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Validates the backend images still build (no push).
  # If this is green but local api/storage crash with MODULE_NOT_FOUND,
  # the local images are stale -> rebuild with --no-cache.
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api, storage]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/self-hosted/${{ matrix.service }}
          file: apps/self-hosted/${{ matrix.service }}/${{ matrix.service == 'storage' && 'dockerfile' || 'Dockerfile' }}
          push: false
          tags: locketdio-${{ matrix.service }}:ci

  # Boots the backend images and fails if any required module is missing
  # (e.g. a source file absent from the build context). Other boot errors
  # (missing credentials/env) are ignored — only MODULE_NOT_FOUND fails.
  smoke-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: apps/self-hosted/api
          file: apps/self-hosted/api/Dockerfile
          push: false
          load: true
          tags: locketdio-api:ci

      - name: Build storage image
        uses: docker/build-push-action@v6
        with:
          context: apps/self-hosted/storage
          file: apps/self-hosted/storage/dockerfile
          push: false
          load: true
          tags: locketdio-storage:ci

      - name: Boot containers and check for missing modules
        run: |
          docker run --rm locketdio-api:ci test -f src/utils/logEventUtils.js
          docker run -d --name smoke-api locketdio-api:ci
          docker run -d --name smoke-storage locketdio-storage:ci
          sleep 15
          echo "===== api logs ====="
          docker logs smoke-api 2>&1 | tail -n 20
          echo "===== storage logs ====="
          docker logs smoke-storage 2>&1 | tail -n 20
          docker logs smoke-api > /tmp/api.log 2>&1
          docker logs smoke-storage > /tmp/storage.log 2>&1
          docker rm -f smoke-api smoke-storage
          if grep -q 'MODULE_NOT_FOUND' /tmp/api.log /tmp/storage.log; then
            echo "SMOKE FAIL: MODULE_NOT_FOUND in backend image"
            exit 1
          fi
          echo "SMOKE OK: no missing modules"
