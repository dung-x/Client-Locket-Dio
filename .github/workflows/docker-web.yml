name: docker-web

# Builds the self-hosted web image and publishes it to GHCR,
# so it can be pulled without a local build:
#   docker pull ghcr.io/dung-x/client-locket-dio-web:latest
on:
  push:
    branches: [main]
    paths:
      - "apps/self-hosted/web/**"
      - ".github/workflows/docker-web.yml"
  pull_request:
    paths:
      - "apps/self-hosted/web/**"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dung-x/client-locket-dio-web

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/self-hosted/web
          file: apps/self-hosted/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
